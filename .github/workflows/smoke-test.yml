name: Smoke Test

on:
  deployment_status:

jobs:
  smoke-test:
    name: Smoke Test (Production)
    runs-on: ubuntu-latest
    if: |
      github.event.deployment_status.state == 'success' &&
      github.event.deployment.environment == 'Production'
    steps:
      - name: Frontend — /login
        run: |
          URL="https://japanese-study-app-front-dev.vercel.app/login"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "$URL")
          echo "GET $URL → $STATUS"
          [ "$STATUS" = "200" ] || (echo "❌ 실패" && exit 1)
          echo "✅ 통과"

      - name: Frontend — /save (미인증 시 /login 리다이렉트)
        run: |
          URL="https://japanese-study-app-front-dev.vercel.app/save"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 -L "$URL")
          echo "GET $URL (리다이렉트 포함) → $STATUS"
          [ "$STATUS" = "200" ] || (echo "❌ 실패" && exit 1)
          echo "✅ 통과"

      - name: Backend — /health
        run: |
          URL="https://japanese-study-app.onrender.com/health"
          for i in 1 2 3 4 5; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 "$URL" || echo "000")
            echo "시도 $i → HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              RESPONSE=$(curl -s --max-time 60 "$URL" || echo "")
              echo "$RESPONSE" | grep -q '"status":"OK"' || (echo "❌ 응답 body 불일치" && exit 1)
              echo "✅ 통과"
              exit 0
            fi
            [ $i -lt 5 ] && sleep 30
          done
          echo "❌ 5회 재시도 후 실패"
          exit 1
